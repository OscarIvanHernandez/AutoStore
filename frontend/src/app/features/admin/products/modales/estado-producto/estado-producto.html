<div class="modal-overlay" *ngIf="visible && productoActualEstado && productoNuevoEstado">
  <div class="modal-card">
    <h2>Cambiar estado del producto</h2>
    <p style="margin-bottom: 15px; color: #64748b;">
      Producto: <strong>{{ productoActualEstado.nombre }}</strong> <br>
      Estado actual: <strong>{{ productoActualEstado.activo }}</strong>
    </p>

    <form #productoNgForm = "ngForm"(ngSubmit)="guardarCambios()">
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Estado del producto</label>
          <div>
            <label>
              <input type="radio" name="Estado" [(ngModel)] = "productoNuevoEstado.activo" [value]="true">Activo
            </label>
            <label>
              <input type="radio" name="Estado" [(ngModel)] = "productoNuevoEstado.activo" [value]="false">Inactivo
            </label>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <div class="form-help">
          <button
            type="button"
            class="form-help__toggle"
            (click)="alternarAyuda()"
            [attr.aria-expanded]="mostrarAyuda"
            aria-controls="product-form-help"
            [attr.aria-label]="mostrarAyuda ? 'Ocultar ayuda del formulario' : 'Mostrar ayuda del formulario'">
            ?
          </button>
          <section
            *ngIf="mostrarAyuda"
            class="form-help__panel"
            id="product-form-help"
            role="region"
            aria-labelledby="product-form-help-title">
            <h3 id="product-form-help-title">Guía rápida</h3>
            <p>Campos de estado para el producto:</p>
            <ul>
              <li><strong>Activo:</strong> se muestra en inventario y ventas.</li>
              <li><strong>Inactivo:</strong> oculto o no disponible.</li>
            </ul>
          </section>
        </div>
        <button type="button" class="btn-secondary" (click)="cerrar()" [disabled]="isSaving">Cerrar</button>
        <button type="submit" class="btn-primary" [disabled]="isSaving">{{ isSaving ? 'Guardando...' : 'Aplicar Cambio' }}</button>
      </div>
    </form>
  </div>
</div>
