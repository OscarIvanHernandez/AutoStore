<div class="sales-container">

  <!-- COLUMNA IZQUIERDA: Búsqueda y Carrito -->
  <div class="w-2/3">
    <!-- Buscador de Productos -->
    <div class="search-box relative">
      <input
        type="text"
        placeholder="🔍 Buscar por nombre o marca para agregar..."
        [(ngModel)]="busquedaTexto"
        (input)="BuscarProducto()"
        class="w-full p-2 border rounded">

      <!-- Resultados desplegables -->
      <ul *ngIf="productosEncontrados.length > 0" class="absolute bg-white border w-full shadow-lg z-10">
        <li
          *ngFor="let prod of productosEncontrados"
          (click)="agregarAlCarrito(prod)"
          class="p-2 hover:bg-gray-100 cursor-pointer flex justify-between">
          <span>{{ prod.nombre }} ({{ prod.marca }})</span>
          <span class="font-bold">${{ prod.precioMostrador }} — Stock: {{ prod.stock }}</span>
        </li>
      </ul>
      <div class="products-card-content">
        <table>
          <thead class="search-products-header">
            <td>
              <input
              type="text"
              placeholder="🔍 Buscar por nombre o marca para agregar..."
              [(ngModel)]="busquedaTexto"
              (input)="BuscarProducto()"
              class="w-full p-2 border rounded">
            </td>
          </thead>
        </table>
      </div>
    </div>

    <!-- Tabla del Carrito -->
    <table class="w-full mt-4 border-collapse border">
      <thead>
        <tr class="bg-gray-200">
          <th>Producto</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of carrito; let i = index">
          <td>{{ item.nombre }}</td>
          <td>
            <select [(ngModel)]="item.precioTipo" (change)="actualizarSubtotal(item)">
              <option value="MOSTRADOR">Mostrador (${{ item.precioUnitario }})</option>
              <option value="TALLER">Taller</option>
            </select>
          </td>
          <td>
            <input
              type="number"
              [(ngModel)]="item.cantidad"
              (change)="actualizarSubtotal(item)"
              min="1"
              [max]="item.stockMaximo"
              class="w-16 border text-center">
          </td>
          <td>${{ item.subTotal }}</td>
          <td>
            <button (click)="eliminarDelCarrito(i)" class="text-red-500">❌</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- COLUMNA DERECHA: Resumen y Cobro -->
  <div class="w-1/3 bg-gray-50 p-4 border rounded">
    <h3 class="text-xl font-bold mb-4">Resumen de Venta</h3>

    <div class="mb-4">
      <label>Tipo de Venta:</label>
      <select [(ngModel)]="tipoVenta" class="w-full p-2 border rounded">
        <option value="CONTADO">Contado</option>
        <option value="CREDITO">Crédito</option>
      </select>
    </div>

    <div class="mb-4">
      <label>Descuento ($):</label>
      <input type="number" [(ngModel)]="descuento" min="0" class="w-full p-2 border rounded">
    </div>

    <div class="border-t pt-4 text-right">
      <p>Subtotal: <strong>${{ subtotalGeneral }}</strong></p>
      <p class="text-2xl font-bold text-green-600">Total: ${{ totalFinal }}</p>
    </div>

    <button
      [disabled]="carrito.length === 0"
      (click)="procesarVenta()"
      class="w-full mt-6 bg-green-500 text-white p-3 rounded font-bold hover:bg-green-600 disabled:bg-gray-300">
      💵 PROCESAR COBRO
    </button>
  </div>

</div>
