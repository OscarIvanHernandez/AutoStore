<div class="distribuidores-container">
  <h2>🚚 Gestión de Distribuidores</h2>

  <!-- Acciones y Filtro -->
  <div class="actions-bar">
    <button (click)="abrirModalNuevo()" class="btn-primary">➕ Nuevo Distribuidor</button>
    <label>
      <input type="checkbox" [(ngModel)]="mostrarInactivos" (change)="cargarDistribuidores()" />
      Mostrar inactivos
    </label>
  </div>
  <div class="messages">
    <span *ngIf="successMessage">{{successMessage}}</span>
    <span *ngIf="errorMessage">{{errorMessage}}</span>
  </div>

  <!-- Tabla de Registros -->
  <table class="tabla-distribuidores" *ngIf="!isLoading && distribuidores.length > 0">
    <thead>
      <tr>
        <th>Nombre / Proveedor</th>
        <th>Teléfono</th>
        <th>Contacto (Opcional)</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of distribuidores" [class.inactivo]="!d.activo">
        <td><strong>{{ d.nombre }}</strong></td>
        <td>{{ d.telefono }}</td>
        <td>{{ d.contacto || '-' }}</td>
        <td>
          <span [class]="d.activo ? 'badge activo' : 'badge inactivo'">
            {{ d.activo ? 'ACTIVO' : 'INACTIVO' }}
          </span>
        </td>
        <td>
          <ng-container *ngIf="d.activo">
            <button (click)="abrirModalEditar(d)">✏️ Editar</button>
            <button (click)="desactivar(d.id)" class="btn-danger">🗑️ Desactivar</button>
          </ng-container>
          <ng-container *ngIf="!d.activo">
            <button (click)="activar(d.id)" class="btn-success">🔄 Reactivar</button>
          </ng-container>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="isLoading">Cargando catálogo...</p>

  <app-agregar
    *ngIf="mostrarModalAgregar"
    [visible]="mostrarModalAgregar"
    (close)="cerrarModalAgregar()"
    (save)="guardar($event)"
  />

  <app-editar
    *ngIf="mostrarModalEditar"
    [visible]="mostrarModalEditar"
    [distribuidor]="distribuidorForm"
    (close)="cerrarModalEditar()"
    (update)="guardar($event)"
  />

</div>
