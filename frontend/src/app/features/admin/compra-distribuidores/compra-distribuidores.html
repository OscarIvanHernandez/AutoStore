<div class="compra-container">
  <h2>📦 Registro de Entrada de Mercancía</h2>

  <!-- Sección Distribuidor y Folio -->
  <div class="header-form">
    <div>
      <label>Distribuidor:</label>
      <select [(ngModel)]="distribuidorSeleccionadoId">
        <option [ngValue]="null">-- Seleccionar Proveedor --</option>
        <option *ngFor="let d of distribuidores" [value]="d.id">{{ d.nombre }}</option>
      </select>
    </div>

    <div>
      <label>Folio/Nota (Opcional):</label>
      <input type="text" [(ngModel)]="folio" placeholder="Ej. F-10492" />
    </div>
  </div>

  <hr>

  <!-- Buscador y Agregador de Productos -->
  <div class="agregar-producto-bar">
    <div>
      <label>Producto:</label>
      <select [(ngModel)]="productoSeleccionado" (change)="onSeleccionarProducto()">
        <option [ngValue]="null">-- Seleccionar Producto --</option>
        <option *ngFor="let p of productos" [ngValue]="p">{{ p.nombre }} (Stock actual: {{ p.stockActual }})</option>
      </select>
    </div>

    <div>
      <label>Cantidad:</label>
      <input type="number" [(ngModel)]="cantidad" min="1" />
    </div>

    <div>
      <label>Costo Unitario ($):</label>
      <input type="number" [(ngModel)]="precioUnitarioCompra" min="0" step="0.5" />
    </div>

    <button (click)="agregarProducto()" [disabled]="!productoSeleccionado">➕ Agregar</button>
  </div>

  <!-- Tabla de Detalle -->
  <table class="tabla-compra" *ngIf="items.length > 0">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Costo Unitario</th>
        <th>Subtotal</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items; let i = index">
        <td>{{ item.nombre }}</td>
        <td>{{ item.cantidad }}</td>
        <td>${{ item.precioUnitario | number:'1.2-2' }}</td>
        <td>${{ item.subTotal | number:'1.2-2' }}</td>
        <td><button (click)="quitarItem(i)">🗑️</button></td>
      </tr>
    </tbody>
  </table>

  <div class="footer-compra">
    <h3>Total Compra: ${{ totalCompra | number:'1.2-2' }}</h3>
    <button (click)="guardarCompra()" [disabled]="items.length === 0 || !distribuidorSeleccionadoId" class="btn-success">
      💾 Registrar Entrada y Surtir Inventario
    </button>
  </div>
</div>
