<div class="mercancia-main-container">
  <div class="info-page">
    <section>
      <h2>Historico de mercancia</h2>
    </section>
  </div>

  <div class="search-bar">
    <label for="compra-id">Buscar compra por ID</label>
    <input
      id="compra-id"
      type="number"
      min="1"
      [(ngModel)]="compraId"
      placeholder="Ej. 25"
      (keyup.enter)="buscarCompraPorId()"
    />
    <button type="button" (click)="buscarCompraPorId()" [disabled]="isLoading">
      Buscar
    </button>
    <button type="button" (click)="limpiarBusqueda()" [disabled]="isLoading">
      Limpiar
    </button>
  </div>

  <div class="filters-bar">
    <label for="fecha-inicio">Desde</label>
    <input id="fecha-inicio" type="date" [(ngModel)]="fechaInicio" />

    <label for="fecha-fin">Hasta</label>
    <input id="fecha-fin" type="date" [(ngModel)]="fechaFin" />

    <label for="distribuidor">Distribuidor</label>
    <select id="distribuidor" [(ngModel)]="distribuidorId">
      <option [ngValue]="null">Todos</option>
      <option *ngFor="let distribuidor of distribuidores" [ngValue]="distribuidor.id">
        {{ distribuidor.nombre }}
      </option>
    </select>

    <button type="button" (click)="aplicarFiltros()" [disabled]="isLoading">
      Filtrar
    </button>
    <button type="button" (click)="limpiarBusqueda()" [disabled]="isLoading">
      Limpiar filtros
    </button>
  </div>

  <div class="messages">
    <span *ngIf="successMessage">{{ successMessage }}</span>
    <span *ngIf="errorMessage">{{ errorMessage }}</span>
  </div>

  <table class="historico-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Distribuidor</th>
        <th>Fecha</th>
        <th>Total de compra</th>
        <th>Folio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let elem of historial">
        <td>{{elem.id}}</td>
        <td>{{elem.distribuidor.nombre}}</td>
        <td>{{elem.fecha | date:'dd/MM/yyyy HH:mm'}}</td>
        <td>{{elem.total | number:'1.2-2'}}</td>
        <td>{{elem.folio}}</td>
        <td>
          <button type="button" (click)="abrirDetalles(elem)">Detalles</button>
        </td>
      </tr>
      <tr *ngIf="!isLoading && historial.length === 0">
        <td colspan="6">No hay compras para mostrar.</td>
      </tr>
    </tbody>

  </table>
  <p *ngIf="isLoading">Buscando compras...</p>

  <app-detalles
    *ngIf="mostrarDetalles"
    [visible]="mostrarDetalles"
    [compra]="compraSeleccionada"
    (close)="cerrarDetalles()"
  />
</div>
